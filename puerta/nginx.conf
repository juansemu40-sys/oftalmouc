# Puerta hacia internet: es lo ÚNICO que sale por Tailscale Funnel (o cualquier túnel).
# Deja pasar solo lo que necesita el celular del paciente para abrir el código QR.
# Todo lo demás (pantalla del médico, lista de consultas, historias, trazas, Swagger) responde 404.
# La pantalla del médico sigue abriéndose en http://localhost:8080, que no pasa por aquí.
server {
    listen 80;
    server_tokens off;

    # La app de atrás ya trae sus cabeceras de seguridad (incluida la CSP): se quitan las repetidas.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Robots-Tag;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Solo lectura: desde internet no se crea, cambia ni borra nada.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    # Sin trucos de rutas: los enlaces válidos nunca llevan %, .., // ni barras invertidas.
    if ($request_uri ~ "(%|\.\.|//|\x5c)") {
        return 404;
    }

    # 1. La página del paciente: /p/<token>
    location ~ "^/p/[A-Za-z0-9_-]{16,64}/?$" {
        proxy_pass http://frontend:80;
    }
    # 2. Sus datos y su audio, siempre con el token: /api/paciente/<token> y /api/paciente/<token>/audio
    location ~ "^/api/paciente/[A-Za-z0-9_-]{16,64}(/audio)?$" {
        proxy_pass http://frontend:80;
        proxy_read_timeout 120s;   # la primera vez el audio se genera con ElevenLabs
    }
    # 3. Los archivos de la página (código compilado, estilos y logo)
    location ~ "^/assets/[A-Za-z0-9._-]+$" {
        proxy_pass http://frontend:80;
    }
    location ~ "^/(logo|favicon)-oftalmouc\.png$" {
        proxy_pass http://frontend:80;
    }

    # Todo lo demás: no existe para internet.
    location / {
        return 404;
    }
}
