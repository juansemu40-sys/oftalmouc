# Sirve el frontend compilado y redirige /api al backend (mismo origen: sin problemas de CORS).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                 # no anuncia la versión de nginx

    client_max_body_size 30m;          # audios de dictado

    # --- Cabeceras de seguridad (se aplican a todo lo que sale de aquí) ---
    # CSP: solo se ejecuta el código de esta app; nada de scripts de terceros ni incrustados.
    # Estilos y fuentes: los propios y Google Fonts. Audio e imágenes: los propios y blob: (audio generado).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;                      # nadie puede incrustar la app (clickjacking)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;               # el token del QR no se filtra a otros sitios
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        # El backend trae sus propias cabeceras de seguridad: se quitan para no enviarlas duplicadas
        # (un X-Frame-Options repetido puede hacer que el navegador lo ignore).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;       # Whisper en CPU + agente pueden tardar
        proxy_send_timeout 180s;
    }

    # Archivos ocultos o de respaldo nunca se sirven.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
